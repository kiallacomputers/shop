[build]
  command = "npm run build"
  publish = "dist"

# Nuxt/Vite assets are content-hashed. Cache them for a long time, while
# ensuring HTML/SSR responses are revalidated so they never keep references
# to chunks from an older deployment.
[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Browser security headers are also applied at the Netlify edge. The dynamic
# Content-Security-Policy is intentionally generated by Nitro middleware so it
# can include the configured Supabase origin without hard-coding environment
# values here.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), browsing-topics=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Cross-Origin-Resource-Policy = "same-origin"
    Origin-Agent-Cluster = "?1"
    X-DNS-Prefetch-Control = "off"
    X-Permitted-Cross-Domain-Policies = "none"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
