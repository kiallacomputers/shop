[build]
  command = "npm run build"
  publish = "dist"

# Nuxt/Vite assets are content-hashed. Cache them for a long time, while
# ensuring HTML/SSR responses are revalidated so they never keep references
# to chunks from an older deployment.
[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
